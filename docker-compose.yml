version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decisioniq}
      POSTGRES_USER: ${POSTGRES_USER:-decisioniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisioniq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decisioniq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's DATABASE_URL so the backend reaches the `postgres`
      # service by its Docker network name instead of localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-decisioniq}:${POSTGRES_PASSWORD:-decisioniq}@postgres:5432/${POSTGRES_DB:-decisioniq}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
